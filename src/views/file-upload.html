<!DOCTYPE html>
<html lang="zh-TW">
<%= htmlWebpackPlugin.options.head %>
<body>
<%= htmlWebpackPlugin.options.header %>
<main class="app-main">
    <%= htmlWebpackPlugin.options.aside %>
    <div class="app-main__inner">
        <div class="container">
            <nav class="breadcrumb">
                <a href="/home.html"><img src="assets/img/home-o.svg" alt="home" width="20" height="20"></a>
                <i class="fa fa-angle-right" aria-hidden="true"></i>
                <span>批次上傳</span>
            </nav>
            <div style="display: grid; grid-template-columns: 100%;gap: 16px;width: 100%">
                <!-- 查詢門號區塊 -->
                <div class="section-box">
                    <div class="section-title">查詢門號</div>
                    <div class="form-row">
                        <label class="form-label">
                            查詢期間
                        </label>
                        <label class="input-group sm" style="max-width: 200px">
                            <input id="startDate" type="text" class="date-input" placeholder="請選擇開始日期">
                            <i class="fa fa-calendar-o" aria-hidden="true"></i>
                        </label>
                        <span>至</span>
                        <label class="input-group sm" style="max-width: 200px">
                            <input id="endDate" type="text" class="date-input" placeholder="請選擇結束日期">
                            <i class="fa fa-calendar-o" aria-hidden="true"></i>
                        </label>
                    </div>
                </div>
                <!-- 查詢結果區塊 -->
                <div class="section-box">
                    <div class="section-title">查詢結果</div>
                    <div class="tabs">
                        <button class="tab active">批次上傳</button>
                        <button class="tab">電子簽章</button>
                    </div>
                    <div class="tabs-container">
                        <div class="active">
                            <div class="upload-area">
                                <span class="file-tip"><span style="color:#e53935">*</span>檔案格式：.xlsx或.csv，可批次上傳</span>
                            </div>
                            <div id="dropZone" class="drop-zone" style="margin-top: 16px">
                                <span>拖拉檔案到此或</span>
                                <button id="xlsxBtn" class="upload-btn">選擇 xlsx 檔案</button>
                                <input type="file" id="xlsxInput" style="display:none" multiple accept=".xlsx,.csv">
                            </div>
                            <button id="uploadXlsxBtn" class="upload-btn">上傳</button>
                            <ul id="xlsxFileList"></ul>
                        </div>
                        <div>
                            <div class="upload-area">
                                <button id="SignBtn" class="upload-btn" disabled>批次簽名</button>
                            </div>
                            <div class="table-container">
                                <div id="excel-table"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <%= htmlWebpackPlugin.options.footer %>
    </div>
</main>
</body>
</html>
